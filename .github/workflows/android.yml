name: Android CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  APP_CENTER_SECRET: ${{secrets.APP_CENTER_SECRET}}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Test workflow scripts
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - run: ./gradlew --non-interactive spotlessCheck

  build:
    name: Build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: foss
            assemble_task: app:assembleFossRelease
            artifact_name: Foss
            apk_path: app/build/outputs/apk/foss/release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Detect dev version
        id: version-check
        run: |
          base_version=$(grep 'const val baseVersionName' build-logic/src/main/kotlin/Projects.kt | sed 's/.*"\(.*\)".*/\1/')
          if git tag -l "$base_version" | grep -q .; then
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write sign info
        id: sign-prep
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo releaseStorePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> gradle.properties
            echo releaseKeyAlias='${{ secrets.KEY_ALIAS }}' >> gradle.properties
            echo releaseKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo releaseStoreFile='${{ github.workspace }}/key.jks' >> gradle.properties
            echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > ${{ github.workspace }}/key.jks
            echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean build
        if: steps.version-check.outputs.is_dev == 'false'
        run: ./gradlew --non-interactive clean
      - name: Build with Gradle
        run: ./gradlew --non-interactive ${{ matrix.assemble_task }}
      - name: Upload R8 configuration analyzer report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: R8-configuration-analyzer-${{ matrix.flavor }}
          path: app/build/outputs/mapping/${{ matrix.flavor }}Release/configanalyzer.html
          if-no-files-found: error
      - name: Upload built APK
        if: success() && github.event_name != 'pull_request' && github.repository == 'Chloemlla/LibChecker'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/${{ matrix.apk_path }}
      - name: Set apk path
        id: apk-path
        if: steps.sign-prep.outputs.signing_available == 'true'
        run: |
          apk_file=$(find "${{ matrix.apk_path }}" -maxdepth 1 -name '*.apk' -type f | head -1)
          if [ -z "$apk_file" ]; then
            echo "Built APK not found under ${{ matrix.apk_path }}"
            exit 1
          fi
          echo "apk_path=$apk_file" >> "$GITHUB_OUTPUT"
      - name: Read APK info
        id: apk-info
        if: steps.sign-prep.outputs.signing_available == 'true'
        env:
          FOSS_FILE: ${{ steps.apk-path.outputs.apk_path }}
        run: python3 .github/scripts/read_apk_info.py
      - name: Prepare release assets
        if: steps.sign-prep.outputs.signing_available == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          VERSION_NAME="${{ steps.apk-info.outputs.version-name }}"
          VERSION_CODE="${{ steps.apk-info.outputs.version-code }}"
          cp "${{ steps.apk-path.outputs.apk_path }}" "$GITHUB_WORKSPACE/release-assets/LibChecker-${VERSION_NAME}-${VERSION_CODE}-foss-release.apk"
          (
            cd "$GITHUB_WORKSPACE/release-assets"
            sha256sum *.apk > checksums.txt
          )
      - name: Upload signed APK artifacts
        if: steps.sign-prep.outputs.signing_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: LibChecker-release-assets
          path: release-assets/*
          if-no-files-found: error
      - name: Automatic release (master branch only)
        if: >-
          steps.sign-prep.outputs.signing_available == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          make_latest: true
          generate_release_notes: true
          tag_name: "v${{ steps.apk-info.outputs.version-name }}"
          prerelease: false
          name: "LibChecker ${{ steps.apk-info.outputs.version-name }}"
          files: release-assets/*

  skipped:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Build Telegram message
        id: telegram-message
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TELEGRAM_FOOTER: This push skipped building
          TELEGRAM_TEXT_LIMIT: 4096
        run: python3 .github/scripts/build_telegram_notification.py
      - name: Send commit to telegram
        env:
          CHANNEL_ID: ${{ secrets.TELEGRAM_TO }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_MESSAGE_JSON: ${{ steps.telegram-message.outputs.json }}
        run: |
          PAYLOAD=$(python3 .github/scripts/build_telegram_payload.py --mode message)
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  cancelled:
    runs-on: ubuntu-latest
    if: ${{ false && cancelled() && github.repository == 'Chloemlla/LibChecker' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    needs: [check, build]
    steps:
      - uses: actions/checkout@v7
      - name: Build Telegram message
        id: telegram-message
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TELEGRAM_FOOTER: This push cancelled building
          TELEGRAM_TEXT_LIMIT: 4096
        run: python3 .github/scripts/build_telegram_notification.py
      - name: Send commit to telegram if cancelled
        env:
          CHANNEL_ID: ${{ secrets.TELEGRAM_TO }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_MESSAGE_JSON: ${{ steps.telegram-message.outputs.json }}
        run: |
          PAYLOAD=$(python3 .github/scripts/build_telegram_payload.py --mode message)
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
